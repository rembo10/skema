name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: rembo10/skema

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check release tag matches cabal version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cabal_version=$(sed -n 's/^version:[[:space:]]*//p' server/skema.cabal)
          if [ "${cabal_version%.*}" != "$tag_version" ]; then
            echo "ERROR: git tag v${tag_version} does not match cabal version ${cabal_version}"
            echo "Bump 'version:' in server/skema.cabal before tagging a release."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is applied automatically on semver tag pushes (flavor
          # latest=auto), so it always points at the newest release, never at
          # a dev build of main.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          # PRs don't log in to Docker Hub, so only write the cache on push builds
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}

      - name: Test image
        if: github.event_name != 'pull_request'
        env:
          # Test the tag this run just built, not whatever `latest` points at
          TEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          docker pull "$TEST_IMAGE"

          # Create test directories and config with proper permissions
          mkdir -p test-config test-data test-cache
          cat > test-config/config.yaml << 'EOF'
          library:
            path: "/music"
          EOF
          # Make directories writable by container user (UID 1000)
          sudo chown -R 1000:1000 test-config test-data test-cache

          # Run container with proper environment and volumes (no --rm so we can get logs)
          docker run -d --name skema-test \
            -e SKEMA_HOST=0.0.0.0 \
            -e SKEMA_PORT=8182 \
            -v "$(pwd)/test-config:/config" \
            -v "$(pwd)/test-data:/data" \
            -v "$(pwd)/test-cache:/cache" \
            "$TEST_IMAGE"

          # Wait for container to start
          sleep 10

          # Show logs for debugging
          echo "=== Container Logs ==="
          docker logs skema-test
          echo "=== End Logs ==="

          # Check if container is running
          if ! docker ps | grep skema-test; then
            echo "ERROR: Container failed to start"
            exit 1
          fi

          # Check health
          docker exec skema-test wget --no-verbose --tries=1 --spider http://localhost:8182/ || exit 1

          # Cleanup
          docker stop skema-test || true
          docker rm skema-test || true
          sudo rm -rf test-config test-data test-cache

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "${{ steps.build.outputs.digest }}"
